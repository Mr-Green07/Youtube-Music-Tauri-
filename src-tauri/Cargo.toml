[package]
name = "youtube-music-minimal"
version = "0.1.0"
description = "Lightweight minimal YouTube Music desktop client for Windows"
authors = ["Dynam"]
edition = "2021"

[lib]
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "cookies", "stream"] }
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread"] }
url = "2"
sha1 = "0.10"
hex = "0.4"
dotenvy = "0.15.7"
tauri-plugin-shell = "2.5.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
